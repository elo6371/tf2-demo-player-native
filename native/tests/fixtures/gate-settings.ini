; Gate-owned render configuration.
;
; The gates that capture reference frames point --settings-file at a COPY of this
; file (verify-iso.sh: iso_seed_gate_settings), so what the renderer is asked to
; draw does not depend on what whoever ran the gate happens to have saved in
; %LOCALAPPDATA%/TF2 Demo Player.
;
; Why an empty settings file is not "the default": loadSettings() reads
; `preset` with a 0 fallback (native/src/settings_store.cpp:56-58), so a missing
; key means QualityPreset::Performance, and Performance is the preset that
; switches the sky pass off (native/src/settings_store.cpp:82 sets
; render.skybox = standardQuality; native/src/main.cpp:6866-6868 gates the sky
; draw on persistent.render.skybox). The reference frames this suite pins were
; captured with preset=standard, so a gate pointed at an empty directory
; measures a different renderer. Measured on the T26 pair from verify-all RUN4
; (2026-11-08, HEAD aaf5ec4): the reference capture taken with an empty isolate
; differs from the matrix frame in 113,159 pixels and every one of them is clear
; colour RGB(14,18,22); its trace says `preset=performance` and
; `world sky state=unavailable ... reason=skybox draw disabled by the caller`,
; while the matrix trace says `preset=standard` and
; `world sky state=active vertices=36 triangles=12 faces=6 draws=1`.
;
; Every key loadSettings() reads from [renderer] is written out here explicitly.
; Do not let a key fall back to the compiled default: defaults move when the code
; moves, and the pinned frames would then move for a reason the pin does not
; record. tfRoot is deliberately absent -- it is a machine path, and every caller
; passes --tf-root.
;
; CHANGING ANY KEY HERE CHANGES THE PINNED FRAMES. The fixture is part of the
; capture cache identity (world-geometry-hole-capture.sh: settings=<sha256>),
; so a change recaptures; re-pin PIN_TEXTURED_SHA / PIN_REF_SHA
; (world-geometry-hole-check.sh) in the same commit and say which reading moved
; and why.
[renderer]
preset=1
renderScalePercent=100
viewModelFov=90
vsync=0
outline=0
outline_depth=0
projectileTrajectory=0
selectedPlayerEntity=-1
trajectoryLingerMs=500
trajectoryQuality=1
